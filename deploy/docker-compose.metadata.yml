services:
  postgres:
    image: postgres:16-alpine
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-metafusion}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_NAME:-metafusion_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [metafusion-net]

  backend:
    image: metafusion-catalog-backend:${METAFUSION_TAG:-local}
    build:
      context: ../backend
      # 目录服务的运行镜像就是 backend/Dockerfile 的 server 阶段（没有 catalog-server 阶段，
      # 写错会让该编排在 build 时报 target stage could not be found，而 config 检查发现不了）。
      target: server
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-metafusion}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: ${DB_NAME:-metafusion_db}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/ready]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [metafusion-net]

  frontend:
    image: metafusion-catalog-frontend:${METAFUSION_TAG:-local}
    build:
      context: ../frontend
      args: {BACKEND_ORIGIN: "http://backend:8080"}
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    networks: [metafusion-net]

  docs-site:
    profiles: [docs]
    image: metafusion-catalog-docs:${METAFUSION_TAG:-local}
    build:
      # 文档内容在独立仓库 metafusion-docs（唯一源）；可用 MF_DOCS_DIR 覆盖布局
      context: ${MF_DOCS_DIR:-../../metafusion-docs}
      labels:
        io.metafusion.project: metafusion
    container_name: metafusion-docs
    restart: unless-stopped
    environment: {PORT: "3001"}
    networks: [metafusion-net]

  gateway:
    image: nginx:1.25-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports: ["${HTTP_PORT:-10100}:80"]
    volumes:
      - ./nginx.metadata.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on: [frontend, backend]
    networks: [metafusion-net]

volumes:
  pg_data:
  nginx_logs:
networks:
  metafusion-net:
    driver: bridge