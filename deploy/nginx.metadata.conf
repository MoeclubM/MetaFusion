worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # 与资源上传接口及主栈一致；JSON 写入另受应用层限制。
    client_max_body_size 1024m;

    # 安全基线响应头：与主栈 deploy/nginx.conf 的 http 级同源，避免这个
    # 只有元数据的编排悄悄降级成只有 nosniff/Referrer-Policy。HSTS 与 CSP-Report-Only 也按
    # 主栈口径补齐——两栈的策略文本是同一份，改一条就必须改另一条，否则同一套前端在两个编排下
    # 拿到不同的 CSP，违规清单会对不上。生效前提（CF 透传、preload 取舍）与取值理由
    # 见 deploy/nginx.conf 的 http 级注释，这里不重复。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'" always;


    # 上游看到的协议：与主栈 deploy/nginx.conf 的 http 级同一份口径与同一套取值优先级
    # （CF-Visitor → 上游 X-Forwarded-Proto → $scheme 兜底），理由与边界见该文件的注释，这里不重复。
    # 本编排没有账号前缀，但同一套前端会经这一栈下发带 Cookie 的响应，协议判定必须同源，否则
    # 两个编排下同一个应用拿到两种协议口径。正则里不出现花括号（CI 只挂单文件跑 nginx -t）。
    map "$http_cf_visitor $http_x_forwarded_proto" $mf_forwarded_proto {
        default                       $scheme;
        "~*\"scheme\":\s*\"https\""   https;
        "~*\"scheme\":\s*\"http\""    http;
        "~*^[^ ]* https$"             https;
        "~*^[^ ]* http$"              http;
    }

    # 限流：只保留主栈的通用区（本编排没有账号/互动/存储前缀，不定义 auth_limit，
    # 以免留下一个永不命中的 zone）。命中返回 429，与主栈一致。
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_status 429;
    limit_req_log_level warn;
    server {
        listen 80;
        server_name _;
        # 这里刻意不再写 add_header：nginx 的 add_header 只要在更内层出现，就会整体
        # 取代外层的那一组（不是叠加），server/location 级各写两个头会让上面 http 级的
        # 五个安全头全部失效——主栈 deploy/nginx.conf:310-311 记着同一个坑。
        # 存活端点：本编排只有目录服务，探针也如实只探它。
        # 网关自身 200 只证明 nginx 进程在跑（与主栈 /healthz 同语义）；
        # /health/catalog 才代表目录服务可用。
        location = /healthz {
            # 用 default_type 而不是 add_header：只要本块出现 add_header，http 级的
            # 五个安全头就会整体失效（见上面 server 段的说明）。
            default_type application/json;
            return 200 '{"status":"live","service":"metafusion-gateway","stack":"metadata"}';
        }
        location = /health/catalog {
            # 必须走变量 proxy_pass：字面量上游会在 `nginx -t` 阶段就被解析，
            # CI 里没有 backend 的 DNS 记录会直接 [emerg] host not found（本文件其余
            # location 用变量 + resolver 也正是为了避开这一点）。
            set $catalog_ready "http://backend:8080";
            proxy_pass $catalog_ready/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            set $catalog http://backend:8080;
            proxy_pass $catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }
        # 文档站由本编排的 --profile docs 控制：未启用时没有 docs-site 这个上游，这里必然 502
        # （见 docker-compose.metadata.yml 文件头）。变量 + resolver 是为了让 nginx -t 不去解析上游。
        location /docs/ {
            set $docs http://docs-site:3001;
            proxy_pass $docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $mf_forwarded_proto;
        }
    }
}
