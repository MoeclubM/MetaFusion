worker_processes auto;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # 与资源上传接口及主栈一致；JSON 写入另受应用层限制。
    # 缺口备忘：本文件暂无线主栈的 limit_req（api/auth 分级限流）与
    # X-Frame-Options/Permissions-Policy/CSP 安全头；生产前按主栈补齐。
    client_max_body_size 1024m;
    server {
        listen 80;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        location /api/ {
            set $catalog http://backend:8080;
            proxy_pass $catalog;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_request_buffering off;
        }
        location /docs/ {
            set $docs http://docs-site:3001;
            proxy_pass $docs;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location / {
            set $frontend http://frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
