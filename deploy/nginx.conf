user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 与资源上传接口的请求体上限一致；JSON 写入仍受应用层更小的限制。
    client_max_body_size 1024m;

    # 安全基线响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 限流区域配置
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    # 限流命中默认返回 503，与"上游不可用"撞成同一个状态码：客户端无法区分
    # "我被限流了"和"服务挂了"，运维看日志也得多读一行才能判断。
    # 统一改成 429（与应用自身的限流口径一致），并给出 Retry-After。
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn_status 429;

    # Gzip 压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 配置 Docker 内置 DNS 解析器，设定 short TTL 防止上游容器重启/重建后 IP 变更导致 502 Bad Gateway
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    server {
        listen 80;
        server_name localhost _;

        # ----------------------------------------------------------------------
        # 路由矩阵：每个前缀只有一行 set $x_upstream，切流/回滚只改这一行。
        # 归属以 docs/architecture/service-split-migration.md 第 2 节为准，
        # 与 metafusion-api-gateway/nginx.conf 的矩阵保持一致。
        # 一律用变量 proxy_pass（配合上面的 resolver），上游重建换 IP 也不会 502。
        # 注意：此处不能拆 include —— CI 只挂载本文件跑 nginx -t。
        # ----------------------------------------------------------------------

        # 预览走 /api/storage/* 的资源鉴权，不直代私有桶。
        location /storage/preview/ {
            return 404;
        }

        # === 1. 账号服务 (auth:8081)：/api/auth|/api/setup|/api/admin/users|
        #        /api/oauth|/api/oidc|/.well-known。
        #        令牌只由 auth 签发，其余服务只验签，因此 discovery 与 JWKS 全部归这里。 ===

        location /api/auth/ {
            # 敏感认证接口独立限流
            limit_req zone=auth_limit burst=10 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/setup {
            limit_req zone=auth_limit burst=10 nodelay;
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前缀匹配同时覆盖 /api/admin/users/{id}/role|password
        location /api/admin/users {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 账号域的 /api/admin/*：权限组、权限码、实例设置、邀请码。它们与目录侧的
        # /api/admin/*（货架、外部库、定义…）共前缀，必须逐个精确匹配——
        # 否则会落到目录服务，表现为 404（前端会以为接口不存在）。
        location = /api/admin/groups {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/admin/groups/[^/]+$ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/permissions {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/settings {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/admin/invites {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/admin/invites/[^/]+/revoke$ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/oauth/ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/oidc/ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # issuer 基址是 https://findverse.cc/api，discovery 挂在 /api/.well-known 下；
        # 根路径 /.well-known/ 是 OIDC 标准入口，两条都指向账号服务。
        location /api/.well-known/ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            set $auth_upstream "http://auth:8081";
            proxy_pass $auth_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === 2. 互动服务 (community:8083)：论坛、短评、收藏、互动记录 ===

        location /api/community/ {
            limit_req zone=api_limit burst=20 nodelay;
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/favorites/ {
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/records/ {
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 用户收藏与用户资料同前缀：正则精确匹配单独分流，其余 /api/users/* 仍归目录服务。
        location ~ ^/api/users/[^/]+/favorites$ {
            set $community_upstream "http://community:8083";
            proxy_pass $community_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === 3. 存储服务 (storage:8082)：文件直传、下载、绑定、哈希校验。
        #        整盘/视频传输时间长且分片上传是多请求，故不限流、不缓冲，超时放宽。 ===

        location /api/storage/ {
            proxy_request_buffering off;
            proxy_buffering off;
            set $storage_upstream "http://storage:8082";
            proxy_pass $storage_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # === 4. 元数据目录 (backend:8080)：其余 /api/* 与图片上传。
        #        旧前缀 /api/archive|playback|media 已随 P4 退役（存储契约是
        #        /api/storage/*，前端不调用旧前缀），故不再单列 location。 ===

        # 本地静态资源与图片封面/头像上传代理 (/uploads/* -> backend:8080/uploads/*)
        location /uploads/ {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 图片缓存与跨域配置
            add_header Access-Control-Allow-Origin * always;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }

        # 其余 REST 与 WebSocket API 路由
        location /api/ {
            proxy_request_buffering off;
            limit_req zone=api_limit burst=50 nodelay;
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # 网关自身探针：只答复进程存活，不代表任何上游可用。
        location ~ ^/(healthz|livez|ready|live|health)$ {
            set $backend_upstream "http://backend:8080";
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # === 5. 文档站与前端 ===

        # 独立全量文档站 (SSG/SSR)
        location /docs {
            set $docs_upstream "http://docs-site:3001";
            proxy_pass $docs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 Next.js 页面与静态资源 (包含 /admin, /invites, /community 等所有页面)
        location / {
            set $frontend_upstream "http://frontend:3000";
            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
