# ==============================================================================
# MetaFusion 生产镜像编排配置 (Production Pre-built Image Override)
#
# 使用方式:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# 优势:
#   直接从 GitHub Container Registry 拉取官方预构建优化镜像，服务器无需安装 Go/Node/Bun，
#   1 秒极速启动，杜绝生产构建资源浪费与内存打满。
# ==============================================================================

services:
  frontend:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclubm/metafusion}/frontend:${IMAGE_TAG:-latest}
    restart: always

  # 文档站镜像目前没有任何仓库发布（metafusion-docs 的 CI 只跑 VitePress 构建与死链自查），
  # reset 掉 build 就等于让这一服务在拉取路径下无镜像可选；保留 build，镜像缺席时还能从兄弟目录
  # ../../metafusion-docs 就地构建（账号/互动/存储本来也是就地构建）。
  docs-site:
    image: ${IMAGE_PREFIX:-ghcr.io/moeclubm/metafusion}/docs-site:${IMAGE_TAG:-latest}
    restart: always

  backend:
    build: !reset null
    image: ${IMAGE_PREFIX:-ghcr.io/moeclubm/metafusion}/backend:${IMAGE_TAG:-latest}
    restart: always
