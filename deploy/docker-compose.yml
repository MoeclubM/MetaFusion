services:
  # --------------------------------------------------------------------------
  # 0. 边缘网关与反向代理 (Nginx) — 统一入口 /api/* -> backend, /* -> frontend
  # --------------------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-10100}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
      - docs-site
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1. 前端应用 (Next.js 14 — 见 frontend/package.json，含 /admin 管理后台)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: metafusion-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1.5 独立全量文档站 (VitePress SSG + sirv-cli)
  # --------------------------------------------------------------------------
  docs-site:
    build:
      context: ../docs-site
      dockerfile: Dockerfile
    container_name: metafusion-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 2. 后端业务核心 API (Go 模块化单体)
  # --------------------------------------------------------------------------
  # backend 健康检查：/ready 需 postgres 可达（见 cmd/server/main.go），
  # 与 metadata 栈的 backend 健康检查对齐。
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: server
    container_name: metafusion-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      - REDIS_ADDR=redis:6379
      # ELASTICSEARCH_URL 为历史别名：config 同时认 OPENSEARCH_URL（优先）与
      # ELASTICSEARCH_URL；检索默认走 PostgreSQL，opensearch 默认不启动
      # （--profile search 显式启用），此变量仅在启用搜索时生效。
      - ELASTICSEARCH_URL=http://opensearch:9200
      - ARCHIVE_PATH=/app/module-data/archive
      - ARCHIVE_S3_ENDPOINT=rustfs:9000
      - ARCHIVE_S3_TLS=false
      - ARCHIVE_S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - ARCHIVE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - ARCHIVE_S3_BUCKET=metafusion-master
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # RS256 签名私钥（PEM 或其 base64）。未设置时后端生成进程内临时密钥，
      # 重启即失效（有会话行兜底，已签发的无状态 JWT 重启后需重新登录）；
      # 生产建议在 .env 配置持久密钥。警告：为空时重启会掉线，仅开发可接受。
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    volumes:
      - catalog_archive:/app/module-data/archive
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 3. 主关系数据库 (PostgreSQL 16)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-metafusion}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-metafusion_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # postgres 健康检查重试与 metadata 栈对齐为 10 次，避免慢盘上后端误判。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5. 分布式缓存与任务队列 (Redis 7)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: metafusion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6. 全文与多维聚合搜索引擎 (OpenSearch 2.14)
  #    当前后端无任何 OpenSearch 接线（检索走 PostgreSQL），默认不启动以节省资源；
  #    需要全文搜索时用 --profile search 显式启用。存量 opensearch_data 卷保留。
  # --------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: metafusion-opensearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 7. S3 兼容对象存储 (RustFS)
  # --------------------------------------------------------------------------
  # 镜像 pin 备忘（最小收敛：注释先行，行为不动）：rustfs/mc 当前 :latest 浮动，
  # 待运维确认可用 digest/tag 后再 pin（如 rustfs 某稳定版、mc 某 RELEASE），
  # pin 时同步改两处并验证 storage-init 仍幂等。未确认前不虚构“已验证”版本号。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: metafusion-rustfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-19000}:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - RUSTFS_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - RUSTFS_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - RUSTFS_STORAGE_DIR=/data
    volumes:
      - s3_data:/data
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 8. S3 存储桶初始化。资源通过后端鉴权读取，桶保持私有。
  # --------------------------------------------------------------------------
  storage-init:
    image: minio/mc:latest
    container_name: metafusion-storage-init
    depends_on:
      - rustfs
    environment:
      - S3_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - S3_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    # 等待对象存储就绪后再启动后端，避免已启用 archive 在首次探测时被判故障。
    entrypoint: >
      /bin/sh -c "
      attempts=0;
      until mc alias set local http://rustfs:9000 \"$${S3_ROOT_USER}\" \"$${S3_ROOT_PASSWORD}\" >/dev/null 2>&1 &&
        mc mb --ignore-existing local/metafusion-master >/dev/null 2>&1; do
        attempts=$$((attempts + 1));
        if [ $$attempts -ge 30 ]; then echo 'storage-init: bucket initialization failed' >&2; exit 1; fi;
        sleep 2;
      done;
      echo 'storage-init: private archive bucket ready';
      "
    networks:
      - metafusion-net

networks:
  metafusion-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  opensearch_data:
  s3_data:
  catalog_archive:
  nginx_logs:
