services:
  # --------------------------------------------------------------------------
  # 0. 边缘网关与反向代理 (Nginx) — 统一入口 /api/* -> backend, /* -> frontend
  # --------------------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-10100}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - frontend
      - docs-site
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1. 前端应用 (Next.js 15 — 含 /admin 管理后台)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: metafusion-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1.5 独立全量文档站 (VitePress SSG + sirv-cli)
  # --------------------------------------------------------------------------
  docs-site:
    build:
      context: ../docs-site
      dockerfile: Dockerfile
    container_name: metafusion-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 2. 后端业务核心 API (Go 模块化单体)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: server
    container_name: metafusion-backend
    restart: unless-stopped
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      - REDIS_ADDR=redis:6379
      - ELASTICSEARCH_URL=http://opensearch:9200
      - S3_ENDPOINT=http://rustfs:9000
      - S3_PUBLIC_ENDPOINT=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - S3_BUCKET_MASTER=metafusion-master
      - S3_BUCKET_PREVIEW=metafusion-preview
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      # RS256 签名私钥（PEM 或其 base64）。未设置时后端生成进程内临时密钥，
      # 重启即失效（有会话行兜底）；生产建议在 .env 配置持久密钥。
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 3. 主关系数据库 (PostgreSQL 16)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-metafusion}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-metafusion_db}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5. 分布式缓存与任务队列 (Redis 7)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: metafusion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6. 全文与多维聚合搜索引擎 (OpenSearch 2.14)
  #    当前后端无任何 OpenSearch 接线（检索走 PostgreSQL），默认不启动以节省资源；
  #    需要全文搜索时用 --profile search 显式启用。存量 opensearch_data 卷保留。
  # --------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: metafusion-opensearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 7. S3 兼容对象存储 (RustFS)
  # --------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: metafusion-rustfs
    restart: unless-stopped
    ports:
      - "${S3_PORT:-19000}:9000"
    environment:
      - RUSTFS_ACCESS_KEY=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - RUSTFS_SECRET_KEY=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - RUSTFS_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - RUSTFS_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - RUSTFS_STORAGE_DIR=/data
    volumes:
      - s3_data:/data
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 8. S3 存储桶初始化 — 用 mc 创建 master/preview 双桶（幂等），失败不阻塞主链。
  #    桶策略保持私有（经后端签名/网关反代访问）；公开读需运维显式执行
  #    mc anonymous set download 自动生成别名/metafusion-preview。
  # --------------------------------------------------------------------------
  storage-init:
    image: minio/mc:latest
    container_name: metafusion-storage-init
    depends_on:
      - rustfs
    environment:
      - S3_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - S3_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://rustfs:9000 \"$${S3_ROOT_USER}\" \"$${S3_ROOT_PASSWORD}\" >/dev/null 2>&1 || exit 0;
      mc mb --ignore-existing local/metafusion-master local/metafusion-preview;
      echo 'storage-init: buckets ensured (metafusion-master, metafusion-preview).';
      exit 0;
      "
    networks:
      - metafusion-net

networks:
  metafusion-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  opensearch_data:
  s3_data:
  nginx_logs:
