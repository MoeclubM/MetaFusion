# ==============================================================================
# MetaFusion 全系统编排：一条命令拉起网关 + 前端 + 文档站 + 元数据目录 + 账号 +
# 互动 + 存储，以及基础设施 (PostgreSQL / Redis / RustFS)。
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# 账号 / 互动 / 存储三个服务与主仓库并列检出（deploy/../.. 下的 metafusion-*），
# 因此这里用跨仓库构建上下文；只检出主仓库的机器需改用预构建镜像。
#
# 唯一对外端口是网关 (HTTP_PORT)，其余服务只在 metafusion-net 内可达，避免重复暴露。
# 路由归属以 docs/architecture/service-split-migration.md 第 2 节为准。
# ==============================================================================
services:
  # --------------------------------------------------------------------------
  # 0. 边缘网关 (Nginx) — 统一入口：按前缀分流到各自治服务
  #    路由矩阵就是挂进来的 ./nginx.conf（唯一生效来源）；metafusion-api-gateway 仓库
  #    只保留切流自检脚本，它自己的 nginx.conf 不参与部署。
  # --------------------------------------------------------------------------
  gateway:
    image: nginx:1.25-alpine
    container_name: metafusion-gateway
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-10100}:80"
    # nginx.conf 声明 worker_connections 4096，而容器默认 nofile 只有 1024：并发一上来
    # nginx 拿不到 socket，直接以 503（rt=0.000）拒掉新连接——压力下表现为"服务偶发不可用"。
    # 把软硬上限抬到与 worker_connections 匹配，并在 nginx -t 时不再有 ulimit 警告。
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      # 等 /ready 通过再开门：上游没起来时网关直接 502，会掩盖真实故障点。
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
      community:
        condition: service_healthy
      storage:
        condition: service_healthy
      frontend:
        condition: service_started
      docs-site:
        condition: service_started
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 1. 前端应用 (Next.js 14 — 见 frontend/package.json，含 /admin 管理后台)
  #    调用都是同源 /api/*，由网关分流，前端不感知服务拆分。
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* 是**构建期内联**：必须在 build 阶段传，运行期 environment 无效。
      # 留空即前端按同源网关路径工作（当前部署形态）；要指向外部服务域名再填。
      args:
        NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-}
        NEXT_PUBLIC_FORUM_URL: ${NEXT_PUBLIC_FORUM_URL:-}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-}
        NEXT_PUBLIC_RESOURCE_STATION_URL: ${NEXT_PUBLIC_RESOURCE_STATION_URL:-}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-}
    container_name: metafusion-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 2. 全量文档站 (VitePress SSG + sirv-cli)，经网关 /docs 反代
  #    内容在独立仓库 metafusion-docs（唯一源）。默认按"与主仓库并列检出"解析（../../），
  #    可用 MF_DOCS_DIR 改成任意布局（例如全部放在主仓库内的 services/ 下）。
  # --------------------------------------------------------------------------
  docs-site:
    build:
      context: ${MF_DOCS_DIR:-../../metafusion-docs}
      dockerfile: Dockerfile
    container_name: metafusion-docs
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 3. 元数据目录 (Go) — 收紧为只负责实体/关系/检索等目录职责
  #    账号、互动、存储已由独立服务承载，因此这里不再持有 ARCHIVE_*/S3 变量与
  #    归档卷：职责与数据都不复制（迁移基准第 3 节）。
  # --------------------------------------------------------------------------
  # backend 健康检查：/ready 需 postgres 可达（见 cmd/server/main.go）。
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: server
    image: metafusion-backend:${METAFUSION_TAG:-local}
    container_name: metafusion-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      # 检索走 PostgreSQL（见 docs/architecture/cutover-runbook.md 第 4 节），Redis 只常驻未用，
      # opensearch 默认不启动（--profile search 才拉起）：没有任何代码读缓存/检索地址，
      # 因此这里不声明这类变量。
      # /api/capabilities 是"部署态"声明：能力在不在由这几个变量决定（capabilities/subsystems 的 envKey）。
      # 目录不探测上游、不发任何出站请求；不配的能力会被判为未部署，前端按 enabled 隐藏入口。
      # 互动（论坛/短评/收藏/私信）由同一个互动服务承载，因此只有一条 community 声明。
      - COMMUNITY_URL=http://community:8083
      - STORAGE_URL=http://storage:8082
      # 目录只验签、不签发：优先静态公钥，其次账号服务的 JWKS，都没有时才回退到私钥（启动会打告警）。
      # 私钥只属于账号服务——目录**不再需要** AUTH_JWT_PRIVATE_KEY，因此这里不再注入。
      # 切换窗口：公钥与 JWKS 都没配时，目录的写接口会一律按未登录处理（fail closed，不会静默放行）。
      - AUTH_JWT_PUBLIC_KEY=${AUTH_JWT_PUBLIC_KEY:-}
      - AUTH_JWKS_URL=${AUTH_JWKS_URL:-http://auth:8081/api/oidc/jwks}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 4. 账号服务 (metafusion-auth) — 注册/登录、会话、RS256 令牌签发与吊销、OAuth2/OIDC
  #    自有 auth schema；issuer/audience/私钥必须与目录侧完全一致，否则存量令牌全部失效。
  # --------------------------------------------------------------------------
  auth:
    build:
      context: ${MF_AUTH_DIR:-../../metafusion-auth}
      dockerfile: Dockerfile
    image: metafusion-auth:${METAFUSION_TAG:-local}
    container_name: metafusion-auth
    restart: unless-stopped
    environment:
      - PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      - AUTH_JWT_PRIVATE_KEY=${AUTH_JWT_PRIVATE_KEY:-}
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    # 服务镜像基于 alpine，只有 busybox wget 没有 curl；/ready 会 ping postgres，
    # 数据库不可达时返回 503，正好当健康判据。
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5. 互动服务 (metafusion-community) — 论坛、短评、收藏、互动记录
  #    自有 community schema；实体可见性问目录服务，不直连目录库。
  # --------------------------------------------------------------------------
  community:
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: Dockerfile
    image: metafusion-community:${METAFUSION_TAG:-local}
    container_name: metafusion-community
    restart: unless-stopped
    environment:
      - PORT=8083
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      # auth 是唯一签发方，JWKS 指向账号服务（不再回指目录服务）。
      - COMMUNITY_JWKS_URL=http://auth:8081/api/oidc/jwks
      # 存量不透明会话令牌的兜底解析：身份问题只问账号服务（不查目录服务）。
      - AUTH_URL=http://auth:8081
      - CATALOG_URL=http://backend:8080
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8083/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 5b. 互动数据搬运工具（一次性）— 把主仓库旧表搬进 community.*
  #     forward：modules.forum_* / catalog.favorites → community.*
  #     back   ：反向搬运，仅用于"切流后还要退回单体"的回滚窗口。
  #     幂等（全部 ON CONFLICT DO NOTHING）、只读源表，可重复运行补增量。
  #     常驻编排不启动它（profiles: tools），只在切流窗口显式调用：
  #       docker compose run --rm community-migrate -direction forward -dry-run
  #       docker compose run --rm community-migrate -direction forward
  #     与 community 共用同一镜像，保证搬运逻辑与被部署的代码是同一份。
  # --------------------------------------------------------------------------
  community-migrate:
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: Dockerfile
    image: metafusion-community:${METAFUSION_TAG:-local}
    profiles: ["tools"]
    entrypoint: ["/app/community-migrate"]
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6. 存储服务 (metafusion-storage) — 物理文件、内容寻址、去重、绑定与下载
  #    自有 storage schema；元数据不落在这里（只按实体 id 问目录服务可见性）。
  # --------------------------------------------------------------------------
  storage:
    build:
      context: ${MF_STORAGE_DIR:-../../metafusion-storage}
      dockerfile: Dockerfile
    image: metafusion-storage:${METAFUSION_TAG:-local}
    container_name: metafusion-storage
    restart: unless-stopped
    environment:
      - PORT=8082
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-metafusion}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - DB_NAME=${DB_NAME:-metafusion_db}
      - STORAGE_ROOT=/app/storage-data
      - STORAGE_S3_ENDPOINT=http://rustfs:9000
      - STORAGE_S3_TLS=false
      # 对象存储凭据（RustFS 的 root 用户/口令）的唯一来源；服务侧只认 S3 协议，与具体实现无关。
      # 读取方是 metafusion-storage（internal/config 的 STORAGE_S3_ACCESS_KEY/_SECRET_KEY）；
      # 对象存储容器自己读的是 RUSTFS_*，见下面服务 10。
      - STORAGE_S3_ACCESS_KEY=${RUSTFS_ROOT_USER:?RUSTFS_ROOT_USER must be set in .env}
      - STORAGE_S3_SECRET_KEY=${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD must be set in .env}
      - STORAGE_S3_BUCKET=metafusion-master
      # 预签名直传的地址必须浏览器可达（SigV4 覆盖 Host）；本编排不把对象存储
      # 端口发到宿主机，留空即沿用内部端点，此时浏览器直传改走
      # PUT /api/storage/upload/stream/{asset_id} 的服务端流式上传。
      - STORAGE_S3_PUBLIC_ENDPOINT=${STORAGE_S3_PUBLIC_ENDPOINT:-}
      - STORAGE_JWKS_URL=http://auth:8081/api/oidc/jwks
      # 存量不透明会话令牌的兜底解析：身份问题只问账号服务（不查目录服务）。
      - AUTH_URL=http://auth:8081
      - CATALOG_URL=http://backend:8080
      - AUTH_JWT_ISSUER=${AUTH_JWT_ISSUER:-https://findverse.cc/api}
      - AUTH_JWT_AUDIENCE=${AUTH_JWT_AUDIENCE:-metafusion}
    volumes:
      # 本地对象模式根目录与直传暂存目录，与目录侧的归档卷无关。
      - storage_data:/app/storage-data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      # 桶由存储服务在启动时自己建（internal/objects ensureBucket），
      # 因此不再需要一次性初始化容器，也就没有"桶没建好就启动"这一类顺序故障。
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 6b. 三个服务自带的管理台（独立应用；决议见解耦审计 §7.3 与
  #     docs/architecture/service-split-migration.md 第 2 节）
  #     为什么独立构建与独立发布：管理台是各服务自己仓库里的 `admin/` 应用（构建上下文取该仓库），
  #     镜像不出现在主仓库的发布矩阵里；某个服务改一个字段就重发它自己的管理台，不必占用主前端的发布窗口。
  #     网关按 `^/admin/(account|community|storage)/` 三条前缀聚合，三条 location 见 deploy/nginx.conf。
  #     刻意不给健康门控：网关对它们的探活是 /admin/<域>/api/health（应用自己的端点），
  #     所以这里用最轻的 depends_on 列表形式——管理台与域 API 并列，不参与网关开门的判据。
  #     image 命名随 frontend（就地构建、不写死名字）：构建上下文是兄弟仓库，主仓库的 CI 构不到它。
  #     不写 healthcheck：三个 admin/Dockerfile 的基础镜像不保证带 wget/curl，
  #     编排层探活会得到"永远 unhealthy"的假象；健康交给网关路径与运维侧的 curl。
  # --------------------------------------------------------------------------
  auth-admin:
    build:
      context: ${MF_AUTH_DIR:-../../metafusion-auth}
      dockerfile: admin/Dockerfile
    container_name: metafusion-auth-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - auth
    networks:
      - metafusion-net

  community-admin:
    build:
      context: ${MF_COMMUNITY_DIR:-../../metafusion-community}
      dockerfile: admin/Dockerfile
    container_name: metafusion-community-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - community
    networks:
      - metafusion-net

  storage-admin:
    build:
      context: ${MF_STORAGE_DIR:-../../metafusion-storage}
      dockerfile: admin/Dockerfile
    container_name: metafusion-storage-admin
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      - storage
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 7. 主关系数据库 (PostgreSQL 16) — 各服务共用实例、独立 schema
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: metafusion-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-metafusion}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - POSTGRES_DB=${DB_NAME:-metafusion_db}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-metafusion} -d ${DB_NAME:-metafusion_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 8. 分布式缓存与任务队列 (Redis 7)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: metafusion-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 9. 全文与多维聚合搜索引擎 (OpenSearch 2.14)
  #    当前后端无任何 OpenSearch 接线（检索走 PostgreSQL），默认不启动以节省资源；
  #    需要全文搜索时用 --profile search 显式启用。存量 opensearch_data 卷保留。
  # --------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: metafusion-opensearch
    profiles: ["search"]
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status'"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - metafusion-net

  # --------------------------------------------------------------------------
  # 10. S3 兼容对象存储 (RustFS) — 只在 metafusion-net 内可达，不发布宿主机端口
  # --------------------------------------------------------------------------
  # 镜像 pin 备忘：rustfs/rustfs 当前 :latest 浮动，待运维确认可用 digest/tag 后再
  # pin（并验证存储服务仍能连上、桶仍能自动创建）。未确认前不虚构"已验证"版本号。
  rustfs:
    image: rustfs/rustfs:latest
    container_name: metafusion-rustfs
    restart: unless-stopped
    environment:
      # 这两行只给 rustfs 容器自己读（canonical 名，源码里是 ENV_RUSTFS_ACCESS_KEY /
      # ENV_RUSTFS_SECRET_KEY）；本仓库的 Go 代码都不读 RUSTFS_* —— 目录服务只读 DB_*/PORT/
      # AUTH_*，存储服务读上面的 STORAGE_S3_*。
      - RUSTFS_ACCESS_KEY=${RUSTFS_ROOT_USER:?RUSTFS_ROOT_USER must be set in .env}
      - RUSTFS_SECRET_KEY=${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD must be set in .env}
      # RUSTFS_ROOT_USER / RUSTFS_ROOT_PASSWORD 是同一镜像的旧名别名（源码里标为 legacy，
      # 只在 canonical 名缺席时兜底）。值与上面两行完全相同，保留是因为镜像 tag 还浮动在
      # :latest（见上方 pin 备忘）：旧版本里旧名才是主名，删掉等于把凭据押在"镜像已升级"
      # 这个未验证前提上。
      # 删除窗口：镜像 pin 到具体 digest（并验证存储服务连得上、桶仍能创建）之后，
      # 随那次编排更新一起删掉这两行——在那之前它们是旧镜像的唯一凭据来源。
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:?RUSTFS_ROOT_USER must be set in .env}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD must be set in .env}
      - RUSTFS_STORAGE_DIR=/data
    volumes:
      - s3_data:/data
    networks:
      - metafusion-net

networks:
  metafusion-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  # opensearch 只在 --profile search 下启用，卷保留以免存量索引数据丢失。
  opensearch_data:
  s3_data:
  storage_data:
  nginx_logs:
