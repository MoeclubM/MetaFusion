# ==============================================================================
# MetaFusion - 本地极速热重载开发配置 (Zero-Rebuild Development Override)
# 使用方法: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# 特点: 源码直接挂载，前端/后台秒级 Fast Refresh 热重载，完全无需每次重新构建 Docker 镜像！
# 前端已切换至 Bun 1.4 运行时（oven/bun:1.4-alpine），比 Node 快 3-5 倍
# ==============================================================================
services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: deps
    container_name: metafusion-frontend-dev
    command: bun run dev -- -p 3000
    volumes:
      - ../frontend/src:/app/src:ro
      - ../frontend/public:/app/public:ro
      - ../frontend/package.json:/app/package.json:ro
      - ../frontend/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ../frontend/next.config.mjs:/app/next.config.mjs:ro
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8080/api/v1
      - WATCHPACK_POLLING=true

  backend:
    volumes:
      - ../backend:/app:ro

  docs-site:
    build:
      context: ../docs-site
      dockerfile: Dockerfile
      target: deps
    container_name: metafusion-docs-dev
    command: npm run dev
    volumes:
      - ../docs-site/src:/app/src:ro
      - ../docs-site/content:/app/content:ro
      - ../docs-site/public:/app/public:ro
      - ../docs-site/package.json:/app/package.json:ro
      - ../docs-site/next.config.mjs:/app/next.config.mjs:ro
    environment:
      - NODE_ENV=development
      - PORT=3001
      - WATCHPACK_POLLING=true
