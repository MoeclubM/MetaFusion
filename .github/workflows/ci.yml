name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：contents 供 checkout，pull-requests 供 gitleaks 扫描 PR 提交
permissions:
  contents: read
  pull-requests: read

jobs:
  # 仓库是公开的：先跑一遍隐私扫描，凭据/私钥/生产主机名一旦提交就收不回来。
  secrets:
    name: security (no credentials in tracked files)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    # 实例专有串（主机名/内网域名等）不进仓库：在仓库变量里配 MF_FORBIDDEN_PATTERNS，
    # 按行分隔；未配置时脚本只做通用检查（私钥、凭据文件、带口令连接串、明文凭据）。
    - run: python scripts/check_no_secrets.py
      env:
        MF_FORBIDDEN_PATTERNS: ${{ vars.MF_FORBIDDEN_PATTERNS }}

  backend:
    name: backend (go vet & build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mf_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_V2_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/mf_v2_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true
      - name: go mod tidy check
        run: go mod tidy -diff
      - name: go test
        run: go test ./...
      - name: go test -race (catalog)
        run: go test -race ./internal/catalog/
      - name: openapi bidirectional coverage
        run: go test ./internal/catalog/ -run 'TestOpenAPIRouteCoverage|TestOpenAPIReverseCoverage' -v
      - name: go vet
        run: go vet ./...
      - name: go build (server+migrate)
        run: |
          CGO_ENABLED=0 go build -o /tmp/mf-server ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/mf-migrate ./cmd/migrate
      - name: migrate up/down roundtrip
        run: |
          /tmp/mf-migrate up
          /tmp/mf-migrate status
          /tmp/mf-migrate down
          /tmp/mf-migrate up
          /tmp/mf-migrate status

  frontend:
    name: frontend (Bun 1.4 + Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: next lint
        # 仓库暂无 eslint 配置文件：有配置则真校验，无配置仅告警不阻塞。
        run: bun run lint || echo "lint skipped, no eslint config"
      - name: i18n keys sync check
        run: |
          bun -e "const fs=require('fs');const ks=f=>Object.keys(JSON.parse(fs.readFileSync('src/messages/'+f,'utf8'))).sort().join('|');const base=ks('zh-CN.json');for(const f of ['en-US.json','zh-TW.json','ja-JP.json']){if(ks(f)!==base){console.error('i18n drift: '+f);process.exit(1)}}console.log('i18n keys in sync')"
      - name: next build (via Bun)
        run: bun run build

  compose-lint:
    name: compose & nginx lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # docker-compose.yml 使用 :? 校验的必填变量，CI 中一律注入 test-only 假值
          DB_PASSWORD: test-only-password
          RUSTFS_ROOT_USER: test-only-user
          RUSTFS_ROOT_PASSWORD: test-only-password
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: metadata-only compose config
        env:
          DB_PASSWORD: test-only-password
        run: docker compose -f deploy/docker-compose.metadata.yml config --quiet
      - name: nginx syntax check
        run: docker run --rm -v $PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t
      - name: metadata nginx syntax check
        run: docker run --rm -v $PWD/deploy/nginx.metadata.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t
  # 文档站已独立为 metafusion-docs 仓库（唯一源），构建与链接自查在那边跑；
  # 本仓库不再持有 doc 页面，故这里没有 docs-site job。

  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
