name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (go vet & build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: mf_v2_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MF_V2_TEST_DSN: postgres://postgres:test-only-password@127.0.0.1:5432/mf_v2_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: go mod tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || (echo "::error::go.mod/go.sum is not tidy"; exit 1)
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
      - name: go build (server+worker+migrate)
        run: |
          CGO_ENABLED=0 go build -o /tmp/mf-server ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/mf-worker ./cmd/worker
          CGO_ENABLED=0 go build -o /tmp/mf-migrate ./cmd/migrate

  frontend:
    name: frontend (Bun 1.4 + Next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: bun install
        run: bun install --frozen-lockfile
      - name: typecheck
        run: bunx tsc --noEmit
      - name: next build (via Bun)
        run: bun run build

  compose-lint:
    name: compose & nginx lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: docker compose config
        env:
          # docker-compose.yml 使用 :? 校验的必填变量，CI 中一律注入 test-only 假值
          DB_PASSWORD: test-only-password
          MINIO_ROOT_USER: test-only-user
          MINIO_ROOT_PASSWORD: test-only-password
          JWT_SECRET: test-only-jwt-secret
        run: docker compose -f deploy/docker-compose.yml config >/dev/null
      - name: metadata-only compose config
        env:
          DB_PASSWORD: test-only-password
        run: docker compose -f deploy/docker-compose.metadata.yml config --quiet
      - name: nginx syntax check
        run: docker run --rm -v $PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro nginx:1.25-alpine nginx -t

  secrets-scan:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
