name: Release & Container Publishing

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "v*"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "是否同时打上 latest 标签"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

# 串行化所有发布运行：main push 与 tag 构建排队执行，避免互相打断或竞争 latest 标签
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # 同 SHA 门禁（审计 O04）：镜像只在**本次提交**的必要检查通过后才构建发布。
  # 跨工作流无法 needs，因此把最小必要检查在发布工作流内重跑一次（同一 SHA）；
  # 完整的跨仓检查（版本锁远端可取、环境矩阵、审计 DDL）仍在 CI 的 cross-repo job，
  # tag 只应在 CI 全绿的提交上打——不要用“CI 红了但 release 绿了”的提交去部署。
  required-checks:
    name: Same-SHA required checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 编排与网关离线检查（与 CI 同口径）
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/check_deploy.py
          python3 scripts/check_gateway_matrix.py
          python3 scripts/check_ci_scripts.py
      - name: 版本锁格式检查（兄弟仓库缺席时只校验格式，不判内容）
        run: python3 scripts/check_versions.py

  docker-publish:
    name: Build & Publish Container Images
    needs: [required-checks]
    runs-on: ubuntu-latest
    env:
      # GHCR 要求镜像仓库路径全小写；此处为唯一来源，需与 deploy/docker-compose.prod.yml 一致
      IMAGE_PREFIX: ghcr.io/moeclubm/metafusion
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: server
            image_name: backend
            # /api/version 的版本身份：镜像里没有 .git，只有构建期注入才靠得住。
            # GIT_SHA 用本次构建的提交，APP_VERSION 用 ref 名（tag 上是 tag，main 上是 main）；
            # migrator 镜像不需要——迁移器二进制不带这两个 -X。
            build_args: |
              GIT_SHA=${{ github.sha }}
              APP_VERSION=${{ github.ref_name }}
          - name: backend-migrator
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: migrator
            image_name: migrator
          - name: frontend-app
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ""
            image_name: frontend
            # Next 的 NEXT_PUBLIC_* 是**构建期内联**：镜像发布后改运行期 env 无效。
            # 这里从仓库变量 vars.* 取值，未配置时为空 → 前端按同源网关路径工作
            # （与当前部署一致）。要指向外部服务域名，先在仓库 Variables 里配置。
            build_args: |
              NEXT_PUBLIC_AUTH_URL=${{ vars.NEXT_PUBLIC_AUTH_URL }}
              NEXT_PUBLIC_FORUM_URL=${{ vars.NEXT_PUBLIC_FORUM_URL }}
              NEXT_PUBLIC_STORAGE_URL=${{ vars.NEXT_PUBLIC_STORAGE_URL }}
              NEXT_PUBLIC_RESOURCE_STATION_URL=${{ vars.NEXT_PUBLIC_RESOURCE_STATION_URL }}
              NEXT_PUBLIC_DOCS_URL=${{ vars.NEXT_PUBLIC_DOCS_URL }}
          # 文档站镜像目前**没有任何仓库发布**（metafusion-docs 的 .github 下只有 ci.yml，
          # 不含 ghcr / build-push-action），生产编排里那份只能就地构建；本仓库只构建目录/前端
          # 与迁移器镜像。等文档站自己发布镜像时，改这里的口径并给 prod 覆盖文件写上 image。

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.publish_latest == 'true' }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target != '' && matrix.target || null }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # 跨仓发布 manifest：一次发布“是什么”只认这一份文件——主仓 SHA、版本锁锚点、
  # 目录库迁移文件、镜像仓库与 digest 解析办法。tag 发布时随附件带走，main 推送
  # 以构建产物形式保留 90 天；部署与回滚以它为准，不以 latest 标签为准。
  release-manifest:
    name: Cross-repo release manifest
    needs: [docker-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write cross-repo manifest
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'EOF'
          import os
          import yaml
          lock = {}
          with open("deploy/versions.lock", encoding="utf-8") as fh:
              for line in fh:
                  text = line.split("#", 1)[0].strip()
                  if text and "=" in text:
                      repo, sha = (p.strip() for p in text.split("=", 1))
                      lock[repo] = sha
          migdir = os.path.join("backend", "migrations")
          migrations = sorted(os.listdir(migdir)) if os.path.isdir(migdir) else []
          manifest = {
              "schema": "metafusion-release-manifest/v1",
              "repo": "MoeclubM/MetaFusion",
              "ref": os.environ.get("GITHUB_REF", ""),
              "sha": os.environ.get("GITHUB_SHA", ""),
              "versions_lock": lock,
              "backend_migrations": migrations,
              "images": {
                  "prefix": "ghcr.io/moeclubm/metafusion",
                  "names": ["backend", "migrator", "frontend"],
              },
              "digest_note": "digest 在部署机上解析：docker buildx imagetools inspect <prefix>/<name>:<tag>；回滚按 manifest 里的 sha 重打 tag，不复用 latest",
          }
          with open("release-manifest.yaml", "w", encoding="utf-8") as fh:
              yaml.safe_dump(manifest, fh, allow_unicode=True, sort_keys=False)
          print(open("release-manifest.yaml", encoding="utf-8").read())
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.yaml
          retention-days: 90

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-publish, release-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build Cross-Platform Migration Tools
        working-directory: backend
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-amd64 ./cmd/migrate
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-arm64 ./cmd/migrate
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-windows-amd64.exe ./cmd/migrate
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-darwin-arm64 ./cmd/migrate

      - name: Download release manifest（随附件发布）
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: manifest-in

      - name: Attach manifest to dist
        run: cp manifest-in/release-manifest.yaml ../dist/release-manifest.yaml
        working-directory: backend

      - name: Generate Changelog & Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
