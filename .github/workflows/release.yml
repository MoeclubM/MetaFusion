name: Release & Container Publishing

on:
  push:
    branches: [main]
    tags: ["v*.*.*", "v*"]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "是否同时打上 latest 标签"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write

# 串行化所有发布运行：main push 与 tag 构建排队执行，避免互相打断或竞争 latest 标签
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  docker-publish:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    env:
      # GHCR 要求镜像仓库路径全小写；此处为唯一来源，需与 deploy/docker-compose.prod.yml 一致
      IMAGE_PREFIX: ghcr.io/moeclubm/metafusion
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: server
            image_name: backend
          - name: backend-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: worker
            image_name: worker
          - name: backend-migrator
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: migrator
            image_name: migrator
          - name: frontend-app
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            target: ""
            image_name: frontend
          - name: docs-site
            context: ./docs-site
            dockerfile: ./docs-site/Dockerfile
            target: ""
            image_name: docs-site

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image_name }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.event.inputs.publish_latest == 'true' }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target != '' && matrix.target || null }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  github-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [docker-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Build Cross-Platform Migration Tools
        working-directory: backend
        run: |
          mkdir -p ../dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-amd64 ./cmd/migrate
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-linux-arm64 ./cmd/migrate
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-windows-amd64.exe ./cmd/migrate
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-w -s" -o ../dist/mf-migrate-darwin-arm64 ./cmd/migrate

      - name: Generate Changelog & Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
