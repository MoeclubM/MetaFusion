<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="bg-ming_dynasty_1566.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#200a0a" />
      <stop offset="100%" stop-color="#3f1414" />
    </linearGradient>
    <linearGradient id="glow-ming_dynasty_1566.svg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid-ming_dynasty_1566.svg" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-ming_dynasty_1566.svg)"/>
  <rect width="600" height="800" fill="url(#grid-ming_dynasty_1566.svg)"/>
  
  <!-- Glow Effect -->
  <circle cx="300" cy="280" r="260" fill="url(#glow-ming_dynasty_1566.svg)" filter="blur(40px)"/>

  <!-- Outer Frame -->
  <rect x="24" y="24" width="552" height="752" rx="16" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="32" y="32" width="536" height="736" rx="12" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Top Badge -->
  <rect x="48" y="52" width="18" height="18" rx="4" fill="#ef4444"/>
  <text x="76" y="66" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="2">METAFUSION ARCHIVE</text>
  <text x="552" y="66" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1">REF: MF-2026</text>

  <!-- Badge Pill -->
  <rect x="48" y="100" width="280" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <circle cx="62" cy="114" r="4" fill="#ef4444"/>
  <text x="74" y="118" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#e2e8f0" letter-spacing="1">4K 数字化重制 · 10BD 盒装</text>

  <!-- Central Visual Graphic -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="140" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="80" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Abstract Icon Shape -->
    <path d="M-40 -40 L40 40 M-40 40 L40 -40" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="0" cy="0" r="30" fill="#200a0a" stroke="#ef4444" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#ef4444"/>
  </g>

  <!-- Title & Metadata Section -->
  <text x="48" y="520" font-family="'Noto Serif SC', 'Instrument Serif', serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.5">大明王朝1566</text>
  <text x="48" y="556" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">MING DYNASTY 1566</text>

  <!-- Divider Line with Accent -->
  <line x1="48" y1="585" x2="552" y2="585" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <line x1="48" y1="585" x2="160" y2="585" stroke="#ef4444" stroke-width="2"/>

  <!-- Subtitle / Credits -->
  <text x="48" y="625" font-family="'Inter', sans-serif" font-size="14" font-weight="400" fill="rgba(255,255,255,0.75)" letter-spacing="0.2">张黎 执导 · 刘和平 编剧</text>

  <!-- Publisher / Bottom Details -->
  <g transform="translate(48, 690)">
    <rect x="0" y="0" width="504" height="42" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="rgba(255,255,255,0.4)" letter-spacing="1">PUBLISHER / LABEL:</text>
    <text x="160" y="26" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">中国国际电视总公司 (CITVC)</text>
